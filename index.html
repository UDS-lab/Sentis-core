<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTIS OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#08080a', cardbg: '#121218' } } } }</script>
</head>
<body class="bg-darkbg text-gray-100 font-sans min-h-screen p-6 flex flex-col items-center">

    <div class="max-w-3xl w-full space-y-6">
        <header class="flex justify-between items-center border-b border-red-900/40 pb-4">
            <h1 class="text-lg font-black tracking-widest text-red-500 font-mono">SENTIS OS</h1>
            <button onclick="setKey()" class="text-xs bg-red-950 text-red-300 px-3 py-1.5 rounded-lg border border-red-800">
                <i class="fa-solid fa-key mr-1"></i> Set API Key
            </button>
        </header>

        <div class="bg-cardbg border border-red-900/30 p-5 rounded-2xl space-y-4 shadow-xl">
            <textarea id="prompt" rows="4" class="w-full bg-black border border-red-900/40 rounded-xl p-3 text-xs text-gray-200 focus:outline-none focus:border-red-500 resize-none" placeholder="Enter prompt here..."></textarea>
            <button onclick="runAI()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center space-x-2 shadow-lg">
                <i class="fa-solid fa-bolt"></i><span>Synthesize (Sub-Second)</span>
            </button>
        </div>

        <div class="bg-cardbg border border-red-900/30 p-5 rounded-2xl min-h-[150px]">
            <div id="out" class="text-xs text-gray-300 leading-relaxed">Awaiting input...</div>
        </div>
    </div>

    <script>
        function setKey() {
            let key = prompt("Enter your Groq API Key (gsk_...):", localStorage.getItem('groq_key') || '');
            if (key) {
                localStorage.setItem('groq_key', key.trim());
                alert("API Key saved locally!");
            }
        }

        async function runAI() {
            let key = localStorage.getItem('groq_key');
            if (!key) {
                setKey();
                return;
            }

            let txt = document.getElementById('prompt').value.trim();
            let out = document.getElementById('out');
            if (!txt) return;

            out.innerHTML = `<span class="text-yellow-400 font-mono animate-pulse">⚡ Processing...</span>`;

            try {
                let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: txt }],
                        temperature: 0.6,
                        max_tokens: 1024
                    })
                });

                let data = await res.json();
                if (data.choices && data.choices[0]) {
                    out.innerHTML = marked.parse(data.choices[0].message.content);
                } else {
                    out.innerHTML = `<span class="text-red-400">Error: ${data.error?.message || 'Unknown error'}</span>`;
                }
            } catch (e) {
                out.innerHTML = `<span class="text-red-400">Network Error: ${e.message}</span>`;
            }
        }
    </script>
</body>
</html>
