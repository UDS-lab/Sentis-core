<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTIS OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#050507', cardbg: '#0f0f13' } } } }
    </script>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 2px; }
        ::-webkit-scrollbar-thumb { background: #3a0a10; }
        .neon-border { border: 1px solid rgba(239, 68, 68, 0.3); }
        .neon-btn { background: linear-gradient(135deg, #dc2626, #991b1b); }
        #out h1, #out h2, #out h3 { color: #f87171; font-weight: 700; margin: 4px 0 2px 0; font-size: 11px; }
        #out p { margin-bottom: 3px; font-size: 10px; }
        #out ul { padding-left: 12px; margin-bottom: 3px; font-size: 10px; list-style-type: disc; }
        #out strong { color: #ffffff; }
    </style>
</head>
<body class="bg-darkbg text-gray-100 font-sans flex flex-col h-screen select-none">

    <!-- Header -->
    <header class="border-b border-red-900/30 bg-darkbg px-3 py-2 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-1.5 cursor-pointer" onclick="renderGrid()" ondblclick="openSetupModal()">
            <div class="w-1.5 h-1.5 bg-red-500 rounded-full animate-ping"></div>
            <span class="text-xs font-black tracking-wider text-white font-mono">SENTIS<span class="text-red-500 text-[8px] ml-1">OS</span></span>
        </div>
        <div id="statusText" class="text-[9px] font-mono text-gray-400">● Ready</div>
        <button onclick="openSetupModal()" class="text-[10px] bg-red-950 text-red-200 px-2 py-1 rounded border border-red-800"><i class="fa-solid fa-key mr-1"></i>Config</button>
    </header>

    <!-- Workspace -->
    <main class="flex-1 p-2 flex flex-col max-w-4xl w-full mx-auto overflow-hidden">
        <div id="workspace" class="flex-1 flex flex-col h-full overflow-hidden"></div>
    </main>

    <!-- Modal -->
    <div id="setupModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-cardbg max-w-xs w-full p-3.5 rounded-xl border border-red-800 space-y-2">
            <h3 class="text-xs font-bold text-white text-center">Neural & License Config</h3>
            <input type="password" id="licenseInput" placeholder="Access Key / Master Key" class="w-full bg-black border border-red-900 text-[10px] p-1.5 rounded text-white font-mono">
            <input type="password" id="geminiInput" placeholder="Gemini API Key (AIzaSy...)" class="w-full bg-black border border-red-900 text-[10px] p-1.5 rounded text-white font-mono">
            <div class="flex space-x-2 pt-1">
                <button onclick="saveConfig()" class="neon-btn text-white text-[10px] font-bold w-full py-1.5 rounded">Save</button>
                <button onclick="closeSetupModal()" class="text-[10px] bg-gray-900 text-gray-400 w-full py-1.5 rounded">Close</button>
            </div>
        </div>
    </div>

    <script>
        const mods = {
            inbox: { title: "Inbox Command", icon: "fa-inbox", tag: "COMMS", sys: "Summarize in 3 bullet points and write a sharp executive reply." },
            qualify: { title: "Lead Qualify", icon: "fa-filter", tag: "REV", sys: "Output: Qualification Score (0-100), Budget Tier, Red Flags, Closing Angle." },
            proposal: { title: "Deal Proposal", icon: "fa-file-contract", tag: "DEAL", sys: "Create a structured B2B Proposal: Summary, Scope, Timeline, ROI." },
            sync: { title: "SOP Co-Pilot", icon: "fa-brain", tag: "OPS", sys: "Convert into a clear SOP with Objective, Prerequisites, and Numbered Steps." },
            call: { title: "Call Intel", icon: "fa-microphone-lines", tag: "INT", sys: "Extract: Key Decisions, Objections, Action Items, Momentum Rating." },
            adcopy: { title: "Ad Matrix", icon: "fa-rectangle-ad", tag: "ADS", sys: "Create 3 ad variations with Headlines, Body Copy, and CTAs." },
            competitor: { title: "Competitor Radar", icon: "fa-radar", tag: "STR", sys: "Output Positioning, Strengths, Weaknesses, and Counter-Script." },
            script: { title: "Sales Script", icon: "fa-scroll", tag: "SAL", sys: "Build a closing script and 3 word-for-word objection rebuttals." },
            churn: { title: "Churn Shield", icon: "fa-shield-halved", tag: "RET", sys: "Diagnose risk level, root cause, and a 7-day recovery plan." },
            onboarding: { title: "Onboarding", icon: "fa-diagram-project", tag: "DEL", sys: "Design a 30-Day Onboarding Roadmap and Welcome Email." }
        };

        let view = 'grid';
        const MASTER_KEY = "UDS-MASTER-2026";

        window.addEventListener('DOMContentLoaded', () => { checkMode(); });

        function checkMode() {
            if (localStorage.getItem('sentis_current_mode') === 'admin') renderAdmin();
            else renderGrid();
        }

        function openSetupModal() {
            document.getElementById('geminiInput').value = localStorage.getItem('sentis_gemini_key') || '';
            document.getElementById('licenseInput').value = localStorage.getItem('sentis_saved_lic') || '';
            document.getElementById('setupModal').classList.remove('hidden');
        }
        function closeSetupModal() { document.getElementById('setupModal').classList.add('hidden'); }

        function saveConfig() {
            let g = document.getElementById('geminiInput').value.trim();
            let l = document.getElementById('licenseInput').value.trim();
            if (g) localStorage.setItem('sentis_gemini_key', g);
            if (l === MASTER_KEY) {
                localStorage.setItem('sentis_current_mode', 'admin');
                closeSetupModal(); renderAdmin(); return;
            }
            if (l) {
                localStorage.setItem('sentis_saved_lic', l);
                let p = l.split('-');
                if(p[2]) localStorage.setItem('sentis_active_client', p[2]);
            }
            localStorage.setItem('sentis_current_mode', 'client');
            closeSetupModal(); renderGrid();
        }

        function renderAdmin() {
            document.getElementById('statusText').innerText = "👑 ADMIN";
            let reg = JSON.parse(localStorage.getItem('sentis_registry') || '[]');
            document.getElementById('workspace').innerHTML = `
                <div class="flex flex-col h-full space-y-2">
                    <div class="flex justify-between items-center bg-red-950/30 p-2 rounded border border-red-900">
                        <span class="text-[10px] text-red-400 font-mono">Master Control</span>
                        <button onclick="localStorage.setItem('sentis_current_mode','client');renderGrid();" class="text-[9px] bg-red-900 px-2 py-0.5 rounded text-white">Client View</button>
                    </div>
                    <button onclick="genKey()" class="neon-btn text-white text-[10px] font-bold py-1.5 rounded">Issue License Key</button>
                    <div class="flex-1 overflow-y-auto space-y-1">
                        ${reg.map((r,i)=>`<div class="bg-black p-1.5 rounded border border-red-900/30 flex justify-between text-[10px] font-mono"><span>${r.c} (${r.k})</span><button onclick="delKey(${i})" class="text-red-400">✕</button></div>`).join('')}
                    </div>
                </div>`;
        }

        function genKey() {
            let n = prompt("Client Name:"); if(!n) return;
            let k = 'SENTIS-ENT-' + n.toUpperCase().replace(/[^A-Z]/g,'') + '-' + Math.floor(100+Math.random()*900);
            let reg = JSON.parse(localStorage.getItem('sentis_registry') || '[]');
            reg.push({c:n, k:k}); localStorage.setItem('sentis_registry', JSON.stringify(reg)); renderAdmin();
        }
        function delKey(i) {
            let reg = JSON.parse(localStorage.getItem('sentis_registry') || '[]');
            reg.splice(i,1); localStorage.setItem('sentis_registry', JSON.stringify(reg)); renderAdmin();
        }

        function renderGrid() {
            view = 'grid';
            let client = localStorage.getItem('sentis_active_client') || 'Workspace';
            document.getElementById('statusText').innerText = "● " + client;
            document.getElementById('workspace').innerHTML = `
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-1.5 h-full overflow-y-auto pb-2">
                    ${Object.keys(mods).map(k=>`
                        <div onclick="openMod('${k}')" class="neon-border bg-cardbg p-2 rounded cursor-pointer flex flex-col justify-between hover:border-red-500 transition h-[68px]">
                            <div class="flex justify-between items-center"><i class="fa-solid ${mods[k].icon} text-red-400 text-xs"></i><span class="text-[7px] font-mono bg-black px-1 rounded text-gray-400">${mods[k].tag}</span></div>
                            <h3 class="text-[10px] font-bold text-white truncate">${mods[k].title}</h3>
                        </div>
                    `).join('')}
                </div>`;
        }

        function openMod(k) {
            view = k;
            let m = mods[k];
            document.getElementById('workspace').innerHTML = `
                <div class="flex flex-col h-full space-y-1.5 overflow-hidden">
                    <div class="flex justify-between items-center shrink-0">
                        <button onclick="renderGrid()" class="text-[9px] bg-cardbg text-red-300 px-2 py-0.5 rounded border border-red-900"><i class="fa-solid fa-chevron-left mr-1"></i>Back</button>
                        <span class="text-[9px] font-mono text-red-400 font-bold">${m.title}</span>
                    </div>
                    <textarea id="prompt" rows="2" class="w-full bg-black border border-red-900/40 rounded p-1.5 text-[10px] text-gray-200 focus:outline-none focus:border-red-500 resize-none shrink-0" placeholder="Paste input text here..."></textarea>
                    <button id="runBtn" onclick="runAI()" class="neon-btn text-white text-[10px] font-bold py-1.5 rounded shrink-0">⚡ Synthesize</button>
                    <div class="flex-1 neon-border bg-cardbg p-2 rounded overflow-y-auto min-h-0">
                        <div id="out" class="text-[10px] text-gray-300">Awaiting input...</div>
                    </div>
                </div>`;
        }

        async function runAI() {
            let key = localStorage.getItem('sentis_gemini_key');
            if(!key) { openSetupModal(); return; }
            let txt = document.getElementById('prompt').value.trim();
            let out = document.getElementById('out');
            if(!txt) { out.innerHTML = "⚠️ Enter text first."; return; }
            out.innerHTML = "⚡ Synthesizing...";
            try {
                let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: mods[view].sys }] },
                        contents: [{ parts: [{ text: txt }] }]
                    })
                });
                let data = await res.json();
                if(data.candidates) out.innerHTML = marked.parse(data.candidates[0].content.parts[0].text);
                else out.innerHTML = "❌ Error: " + (data.error?.message || "Failed");
            } catch(e) { out.innerHTML = "❌ Network Error"; }
        }
    </script>
</body>
</html>
