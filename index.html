<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTIS OS | Enterprise Master & Client Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#08080a', cardbg: 'rgba(18, 18, 24, 0.9)' } } } }</script>
    <style>
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #3a0a10; border-radius: 8px; }
        .neon-border { border: 1px solid rgba(255, 42, 95, 0.35); box-shadow: 0 0 15px rgba(255, 42, 95, 0.15); transition: 0.2s; }
        .neon-border:hover { border-color: rgba(255, 42, 95, 0.85); transform: translateY(-2px); }
        .neon-btn { background: linear-gradient(135deg, #dc2626, #991b1b); box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); }
    </style>
</head>
<body class="bg-darkbg text-gray-100 font-sans min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <header class="border-b border-red-900/30 bg-darkbg/95 px-6 py-3.5 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-red-600 rounded-full animate-ping"></div>
            <span class="text-xl font-black tracking-widest text-white font-mono">SENTIS<span class="text-red-500 text-xs ml-2 bg-red-950 px-2 py-0.5 rounded border border-red-800">v6.0</span></span>
        </div>
        <div class="text-center">
            <h1 id="hTitle" class="text-md font-bold text-red-500 font-mono">Loading...</h1>
            <p id="hSub" class="text-[9px] text-emerald-400 font-mono">● Secure System</p>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openPortalToggle()" id="portalToggleBtn" class="text-xs bg-red-950/40 text-red-200 px-3 py-2 rounded-xl border border-red-800 flex items-center space-x-2">
                <i class="fa-solid fa-user-gear text-red-500"></i><span id="portalToggleText">Switch to Admin</span>
            </button>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-8 flex flex-col max-w-7xl w-full mx-auto">
        <div id="workspace" class="flex-1 flex flex-col justify-center"></div>
    </main>

    <!-- Client Activation Modal -->
    <div id="activateModal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-darkbg max-w-md w-full p-6 rounded-3xl border border-red-800 space-y-4 shadow-2xl text-center">
            <i class="fa-solid fa-lock text-red-500 text-3xl animate-pulse"></i>
            <h3 class="text-md font-bold text-white">Enter Enterprise License Key</h3>
            <p class="text-xs text-gray-400">Your instance is locked. Enter the activation key provided by UDS Admin.</p>
            <input type="text" id="activationInput" placeholder="SENTIS-XXXX-XXXX" class="w-full bg-black border border-red-900/40 text-xs p-3 rounded-xl text-white text-center font-mono focus:outline-none focus:border-red-500">
            <button onclick="verifyClientKey()" class="neon-btn text-white text-xs font-bold w-full py-3 rounded-xl">Activate License</button>
        </div>
    </div>

    <script>
        const mods = {
            inbox: { title: "Inbox Command", icon: "fa-inbox", desc: "Summarizes client email threads & generates high-converting drafts." },
            qualify: { title: "Lead Qualify Engine", icon: "fa-filter", desc: "Scores prospect intent (1-10), budget tier, and closing strategy." },
            proposal: { title: "Deal Proposal Generator", icon: "fa-file-contract", desc: "Turns raw notes into structured commercial proposals instantly." },
            sync: { title: "SOP Knowledge Co-Pilot", icon: "fa-brain", desc: "Instant step-by-step guidance on internal standard operating procedures." },
            call: { title: "Call Intelligence Hub", icon: "fa-microphone-lines", desc: "Extracts key decisions, objections, and assigned team action items." },
            adcopy: { title: "Ad Copy Matrix", icon: "fa-rectangle-ad", desc: "Generates high-converting ad copy for Meta, Google, and LinkedIn." },
            competitor: { title: "Competitor Radar", icon: "fa-radar", desc: "Analyzes competitor strategy, weaknesses, and positioning tactics." },
            script: { title: "Sales Script Builder", icon: "fa-scroll", desc: "Generates closing scripts and counters for client sales objections." },
            churn: { title: "Client Churn Shield", icon: "fa-shield-halved", desc: "Monitors client sentiment and drafts churn prevention strategies." },
            onboarding: { title: "Onboarding Architect", icon: "fa-diagram-project", desc: "Generates automated kickoff roadmaps and welcome documentation." }
        };

        let view = 'grid', fileObj = null;
        const urlParams = new URLSearchParams(window.location.search);
        let isAdmin = urlParams.get('admin') === 'uds';
        let tenant = urlParams.get('client') || 'ApexSystems';
        const sk = k => `sentis_${tenant}_${k}`;

        window.addEventListener('DOMContentLoaded', () => {
            initSystem();
        });

        function initSystem() {
            if (isAdmin) {
                document.getElementById('hTitle').innerText = "UDS Master Admin";
                document.getElementById('hSub').innerText = "● Global Oversight";
                document.getElementById('portalToggleText').innerText = "Client View";
                renderAdminDashboard();
            } else {
                document.getElementById('hTitle').innerText = tenant;
                document.getElementById('hSub').innerText = "● Client Portal";
                document.getElementById('portalToggleText').innerText = "Admin View";
                checkClientAccess();
            }
        }

        function openPortalToggle() {
            if (isAdmin) {
                window.location.search = `?client=${tenant}`;
            } else {
                const pass = prompt("Enter UDS Master Admin Passkey:");
                if (pass === "uds2026") {
                    window.location.search = `?admin=uds`;
                } else if (pass) {
                    alert("❌ Incorrect Admin Passkey!");
                }
            }
        }

        function checkClientAccess() {
            let registry = JSON.parse(localStorage.getItem('sentis_master_registry') || '[]');
            let activeKey = localStorage.getItem(sk('activated_key'));
            
            let found = registry.find(r => r.client === tenant && r.key === activeKey);
            if (!found) {
                document.getElementById('activateModal').classList.remove('hidden');
            } else {
                renderClientGrid();
            }
        }

        function verifyClientKey() {
            let inputKey = document.getElementById('activationInput').value.trim();
            let registry = JSON.parse(localStorage.getItem('sentis_master_registry') || '[]');
            
            let found = registry.find(r => r.client === tenant && r.key === inputKey);
            if (found) {
                localStorage.setItem(sk('activated_key'), inputKey);
                document.getElementById('activateModal').classList.add('hidden');
                alert("🚀 License Activated Successfully!");
                renderClientGrid();
            } else {
                alert("❌ Invalid License Key for this tenant!");
            }
        }

        // --- ADMIN DASHBOARD ---
        function renderAdminDashboard() {
            let registry = JSON.parse(localStorage.getItem('sentis_master_registry') || '[]');
            const box = document.getElementById('workspace');

            box.innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="neon-border bg-cardbg p-5 rounded-2xl">
                            <h4 class="text-xs text-gray-400 font-mono">TOTAL ACTIVE CLIENTS</h4>
                            <p class="text-2xl font-bold text-white mt-1">${registry.length}</p>
                        </div>
                        <div class="neon-border bg-cardbg p-5 rounded-2xl">
                            <h4 class="text-xs text-gray-400 font-mono">SYSTEM REVENUE POTENTIAL</h4>
                            <p class="text-2xl font-bold text-emerald-400 mt-1">$${registry.length * 5000}/mo</p>
                        </div>
                        <div class="neon-border bg-cardbg p-5 rounded-2xl flex items-center justify-between">
                            <div><h4 class="text-xs text-gray-400 font-mono">QUICK ACTION</h4><p class="text-sm font-bold text-red-400 mt-1">Generate License</p></div>
                            <button onclick="generateNewKeyModal()" class="neon-btn text-white px-4 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                    <div class="neon-border bg-cardbg p-6 rounded-3xl space-y-4">
                        <h3 class="text-md font-bold text-white"><i class="fa-solid fa-list-check text-red-500 mr-2"></i>Master Company Directory & Telemetry</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs font-mono">
                                <thead class="border-b border-red-900/40 text-gray-400">
                                    <tr><th class="pb-3">Company Name</th><th class="pb-3">License Key</th><th class="pb-3">AI Executions</th><th class="pb-3">Expiry</th><th class="pb-3">Actions</th></tr>
                                </thead>
                                <tbody class="divide-y divide-red-950/40">
                                    ${registry.length === '0' ? '<tr><td colspan="5" class="py-4 text-center text-gray-500">No client licenses generated yet.</td></tr>' : registry.map(r => {
                                        let usage = localStorage.getItem(`sentis_${r.client}_usage`) || 0;
                                        return `
                                            <tr class="hover:bg-red-950/20">
                                                <td class="py-3 font-bold text-white"><a href="?client=${r.client}" class="text-red-400 hover:underline">${r.client}</a></td>
                                                <td class="py-3 text-gray-300">${r.key}</td>
                                                <td class="py-3 text-amber-400 font-bold">${usage} runs</td>
                                                <td class="py-3 text-gray-400">${r.expiry}</td>
                                                <td class="py-3"><button onclick="revokeKey('${r.key}')" class="text-red-500 hover:text-red-300"><i class="fa-solid fa-trash"></i> Revoke</button></td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateNewKeyModal() {
            let clientName = prompt("Enter Client Company Name (e.g. AcmeCorp):");
            if (!clientName) return;
            let cleanName = clientName.replace(/\s+/g, '');
            let randomCode = 'SENTIS-' + cleanName.toUpperCase() + '-' + Math.floor(1000 + Math.random() * 9000);
            let expiryDate = prompt("Enter Expiry Date (YYYY-MM-DD):", "2028-12-31");

            let registry = JSON.parse(localStorage.getItem('sentis_master_registry') || '[]');
            registry.push({ client: cleanName, key: randomCode, expiry: expiryDate });
            localStorage.setItem('sentis_master_registry', JSON.stringify(registry));

            alert(`✅ Generated Key for ${cleanName}:\nKey: ${randomCode}\nClient Link: ${window.location.origin}${window.location.pathname}?client=${cleanName}`);
            renderAdminDashboard();
        }

        function revokeKey(key) {
            if (confirm("Are you sure you want to revoke this license?")) {
                let registry = JSON.parse(localStorage.getItem('sentis_master_registry') || '[]');
                registry = registry.filter(r => r.key !== key);
                localStorage.setItem('sentis_master_registry', JSON.stringify(registry));
                renderAdminDashboard();
            }
        }

        // --- CLIENT PORTAL ---
        function renderClientGrid() {
            const box = document.getElementById('workspace');
            if (view === 'grid') {
                box.innerHTML = `
                    <div class="mb-5 text-center"><h2 class="text-xl font-black uppercase text-white">10 Enterprise AI Engines</h2><p class="text-xs text-gray-400 font-mono">Tenant: ${tenant}</p></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-6xl mx-auto w-full">
                        ${Object.keys(mods).map(k => `
                            <div onclick="view='${k}';renderClientGrid();" class="neon-border bg-cardbg p-4 rounded-2xl cursor-pointer flex flex-col justify-between space-y-3">
                                <div class="flex justify-between items-center"><div class="w-8 h-8 bg-red-950 border border-red-800 rounded-lg flex items-center justify-center text-red-500"><i class="fa-solid ${mods[k].icon}"></i></div><span class="text-[9px] font-mono text-red-400 bg-red-950 px-2 py-0.5 rounded">ENTERPRISE</span></div>
                                <div><h3 class="text-md font-bold text-white">${mods[k].title}</h3><p class="text-[11px] text-gray-400 mt-0.5">${mods[k].desc}</p></div>
                                <div class="text-[11px] font-semibold text-red-400 flex items-center">Launch <i class="fa-solid fa-arrow-right ml-1"></i></div>
                            </div>
                        `).join('')}
                    </div>`;
            } else {
                const m = mods[view];
                box.innerHTML = `
                    <div class="space-y-4 max-w-4xl mx-auto w-full">
                        <button onclick="view='grid';fileObj=null;renderClientGrid();" class="bg-red-950/40 text-red-300 text-xs px-3 py-1.5 rounded-xl border border-red-800"><i class="fa-solid fa-chevron-left mr-1"></i> Back</button>
                        <div class="neon-border bg-cardbg p-4 rounded-2xl space-y-3">
                            <h2 class="text-md font-bold text-white"><i class="fa-solid ${m.icon} text-red-500 mr-2"></i>${m.title}</h2>
                            <textarea id="prompt" rows="3" class="w-full bg-black border border-red-900/40 rounded-xl p-3 text-xs text-gray-200 focus:outline-none focus:border-red-500 resize-none" placeholder="Enter payload or instructions..."></textarea>
                            <div class="flex justify-between items-center">
                                <label class="cursor-pointer bg-red-950/40 border border-red-800 text-red-300 text-xs px-3 py-2 rounded-xl"><i class="fa-solid fa-paperclip text-red-500 mr-1"><span>Attach File</span></i><input type="file" onchange="handleFile(event)" class="hidden"></label>
                                <span id="fStatus" class="text-xs text-gray-400 font-mono"></span>
                                <button onclick="runAI()" class="neon-btn text-white font-bold px-5 py-2 rounded-xl text-xs"><i class="fa-solid fa-bolt mr-1"></i> Synthesize</button>
                            </div>
                        </div>
                        <div class="neon-border bg-cardbg p-4 rounded-2xl space-y-2 min-h-[180px]">
                            <div class="flex justify-between border-b border-red-900/30 pb-2"><span class="text-xs font-bold text-red-400 font-mono">Output</span><span id="load" class="text-xs text-red-400 font-mono hidden animate-pulse">Running...</span></div>
                            <div id="out" class="text-xs text-gray-300 leading-relaxed">Awaiting execution...</div>
                        </div>
                    </div>`;
            }
        }

        function handleFile(e) {
            const f = e.target.files[0]; if(!f)return;
            const r = new FileReader();
            r.onload = (evt) => { fileObj = { mimeType: f.type, data: evt.target.result.split(',')[1] }; document.getElementById('fStatus').innerText = `📎 ${f.name}`; };
            r.readAsDataURL(f);
        }

        async function runAI() {
            const key = localStorage.getItem(sk('key')) || prompt("Enter your Gemini API Key:");
            if(key && !localStorage.getItem(sk('key'))) localStorage.setItem(sk('key'), key);
            
            const client = tenant, know = localStorage.getItem(sk('knowledge')) || "", txt = document.getElementById('prompt').value.trim(), out = document.getElementById('out'), load = document.getElementById('load');
            if(!key){ alert("API key required!"); return; }
            if(!txt && !fileObj){ out.innerHTML = "⚠️ Provide input."; return; }

            // Track usage for Admin Master Telemetry
            let usage = parseInt(localStorage.getItem(`sentis_${tenant}_usage`) || 0) + 1;
            localStorage.setItem(`sentis_${tenant}_usage`, usage);

            load.classList.remove('hidden'); out.innerHTML = "⚡ Processing...";
            const parts = [{ text: `Client: ${client}. Vault: ${know}. Engine: ${mods[view].desc}. Input: ${txt}` }];
            if(fileObj) parts.push({ inline_data: { mime_type: fileObj.mimeType, data: fileObj.data } });
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts }] }) });
                const d = await res.json();
                out.innerHTML = marked.parse(d?.candidates?.[0]?.content?.parts?.[0]?.text || "No output.");
            } catch(e) { out.innerHTML = "❌ Error: " + e.message; }
            finally { load.classList.add('hidden'); }
        }
    </script>
</body>
</html>
